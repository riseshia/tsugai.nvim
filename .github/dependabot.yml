version: 2
updates:
  - package-ecosystem: npm
    directory: /sidecar
    schedule:
      interval: weekly
    groups:
      # Majors are left out, so each one gets its own PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
